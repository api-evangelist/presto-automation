  - type: Features
    name: Platform Features
    description: Core capabilities offered by the Presto Voice platform.
    data:
      - name: AI Drive-Thru Order Taking
        description: >-
          Automated, 24/7 drive-thru order taking using in-house NLU and large
          language models with ASR and TTS for natural, conversational
          interactions.
      - name: Human-in-the-Loop Supervision
        description: >-
          A full spectrum of operating modes including supervised AI, pure AI,
          agent-led, and unsupervised AI, where remote agents oversee or
          intervene as needed.
      - name: Context-Specific Upselling
        description: >-
          Preference-based, time-based, and modification upselling that makes
          significantly more upsell attempts than human staff to increase order
          value.
      - name: Multi-Language Ordering
        description: >-
          Support for ordering in multiple languages to serve diverse customer
          bases at the drive-thru.
      - name: Menu Unification
        description: >-
          A proprietary system that consolidates disparate QSR menu data into a
          structured, centralized format with brand-level multi-location
          management.
      - name: AI-Native Phone Ordering
        description: >-
          A phone ordering business unit that applies Presto's Voice AI to
          take orders over the phone for quick-service restaurants.
  - type: UseCases
