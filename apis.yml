    description: Common ways quick-service restaurants use Presto Voice.
    data:
      - name: Drive-Thru Labor Savings
        description: >-
          Offloading order taking to Voice AI to free staff for food
          preparation and service, saving labor hours per store per day.
      - name: Revenue Growth Through Upselling
        description: >-
          Driving incremental revenue through consistent, context-aware upsell
          and add-on recommendations on every order.
      - name: Order Accuracy And Speed
        description: >-
          Improving order accuracy and reducing wait times in noisy drive-thru
          environments.
      - name: Phone Order Automation
        description: >-
          Automating inbound phone orders for QSRs to reduce missed calls and
          staffing pressure.
