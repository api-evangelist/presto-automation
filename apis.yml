aid: presto-automation
name: Presto Automation
description: >-
  Presto Automation (now operating as Presto Phoenix, Inc.) is a Silicon
  Valley-based voice AI and automation provider for restaurant drive-thrus and
  quick-service restaurant (QSR) chains. Its flagship product, Presto Voice, is
  an AI-driven drive-thru ordering assistant that automates order taking using
  in-house Natural Language Understanding (NLU) and large language models
  combined with automated speech recognition (ASR) and text-to-speech (TTS),
  with optional human-in-the-loop supervision. Presto offers a full spectrum of
  operating modes (supervised AI, pure AI, agent-led, and unsupervised AI) and
  has expanded into AI-native phone ordering for QSRs. Presto Voice integrates
  into existing drive-thru hardware, confirmation boards, headsets, and POS
  platforms through partnerships with vendors such as Oracle, PAR, and Qu, and
  draws on AI partnerships with OpenAI and ElevenLabs. Presto does not publish a
  public or partner-facing developer API, SDK, or documentation portal;
  integrations are arranged directly with the company through vendor and POS
  partnerships, so no API products are listed here.
