aid: presto-automation
name: Presto Automation
description: >-
  Presto Automation (now operating as Presto Phoenix) is a voice AI and
  automation provider for restaurant drive-thrus, offering Presto Voice, an
  AI-driven drive-thru ordering assistant that automates order taking with
  automated speech recognition, text-to-speech, and human-in-the-loop
  supervision. Presto integrates into existing drive-thru hardware and POS
  platforms through partnerships with vendors such as Oracle, PAR, and Qu, and
  serves quick-service restaurant chains nationwide. Presto does not publish a
  public or partner-facing developer API or documentation portal; integrations
  are arranged directly with the company, so no API products are listed here.
